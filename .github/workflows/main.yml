name: Build, Scan & Push (Main)

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-scan-sign:
    name: Build, SBOM, Scan & Sign Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [ backend, frontend ]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image (Local Tag for Scan)
        id: docker_build
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.component }}.json

      - name: Scan Image Vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.component }}:latest

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Container Image (Keyless OIDC)
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/${{ matrix.component }}@${{ steps.docker_build.outputs.digest }}

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.component }}
          path: sbom-${{ matrix.component }}.json
