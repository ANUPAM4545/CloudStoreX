apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: cloudstorex-backend-hpa
  labels:
    app.kubernetes.io/name: cloudstorex
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudstorex-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
