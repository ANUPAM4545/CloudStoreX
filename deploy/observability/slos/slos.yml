# CloudStoreX Service Level Objectives (SLOs) & Error Budget Specifications
# Rolling Window: 30 Days (720 Hours)

apiVersion: slok.dev/v1beta1
kind: PrometheusServiceLevel
metadata:
  name: cloudstorex-slos
  labels:
    service: cloudstorex
    tier: production
spec:
  service: cloudstorex
  slos:
    # 1. API Availability SLO: 99.9% of HTTP requests succeed (non-5xx)
    - name: api-availability
      objective: 99.9
      description: "99.9% of API requests return non-5xx responses over 30 days"
      sli:
        events:
          errorQuery: |
            sum(rate(cloudstorex_http_errors_total{status=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(cloudstorex_http_requests_total[{{.window}}]))
      alerting:
        name: APIAvailabilitySLOBreach
        labels:
          severity: critical
        annotations:
          summary: "High error budget burn rate for API Availability SLO"

    # 2. Metadata Read Latency SLO: 95% of catalog queries < 50ms
    - name: metadata-latency
      objective: 95.0
      description: "95% of metadata catalog read queries complete in under 50ms"
      sli:
        events:
          errorQuery: |
            sum(rate(cloudstorex_http_request_duration_seconds_count{path=~"/api/v1/storage/buckets.*"}[{{.window}}]))
            - sum(rate(cloudstorex_http_request_duration_seconds_bucket{path=~"/api/v1/storage/buckets.*",le="0.05"}[{{.window}}]))
          totalQuery: |
            sum(rate(cloudstorex_http_request_duration_seconds_count{path=~"/api/v1/storage/buckets.*"}[{{.window}}]))
      alerting:
        name: MetadataLatencySLOBreach
        labels:
          severity: high

    # 3. Policy Evaluation Latency SLO: 99% of policy evaluations < 5ms
    - name: policy-evaluation-latency
      objective: 99.0
      description: "99% of dynamic routing policy evaluations complete in under 5ms"
      sli:
        events:
          errorQuery: |
            sum(rate(cloudstorex_policy_evaluation_latency_seconds_count[{{.window}}]))
            - sum(rate(cloudstorex_policy_evaluation_latency_seconds_bucket{le="0.005"}[{{.window}}]))
          totalQuery: |
            sum(rate(cloudstorex_policy_evaluation_latency_seconds_count[{{.window}}]))
      alerting:
        name: PolicyLatencySLOBreach
        labels:
          severity: high

    # 4. Storage Provider Availability SLO: 99.95% of provider operations succeed
    - name: provider-availability
      objective: 99.95
      description: "99.95% of storage provider operations succeed without SDK errors"
      sli:
        events:
          errorQuery: |
            sum(rate(cloudstorex_provider_errors_total[{{.window}}]))
          totalQuery: |
            sum(rate(cloudstorex_provider_requests_total[{{.window}}]))
      alerting:
        name: ProviderAvailabilitySLOBreach
        labels:
          severity: critical
