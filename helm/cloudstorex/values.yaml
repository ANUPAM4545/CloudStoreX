# Default values for cloudstorex.
# This is a YAML-formatted file.

global:
  environment: production
  imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}

backend:
  replicaCount: 2
  image:
    repository: cloudstorex/backend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  pdb:
    enabled: true
    minAvailable: 1
  env:
    CORS_ALLOWED_ORIGINS: "*"
    MAX_UPLOAD_SIZE_MB: "500"
    JWT_SECRET: "supersecretjwtkey12345678901234567890"

frontend:
  replicaCount: 2
  image:
    repository: cloudstorex/frontend
    pullPolicy: IfNotPresent
    tag: "latest"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: "nginx"
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
  hosts:
    - host: ""
      paths:
        - path: /api
          pathType: Prefix
          backend:
            serviceName: backend
            servicePort: 8080
        - path: /
          pathType: Prefix
          backend:
            serviceName: frontend
            servicePort: 3000
  tls: []

networkPolicy:
  enabled: true

# Embedded Dependencies (can be disabled in favor of external managed services - Refinement 1)
postgresql:
  enabled: true
  image: postgres:16-alpine
  auth:
    database: cloudstorex
    username: cloudstorex
    password: supersecretpgpassword
  persistence:
    enabled: true
    size: 10Gi
  service:
    port: 5432

redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    enabled: true
    size: 5Gi
  service:
    port: 6379

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-01-16T16-07-38Z
  auth:
    rootUser: cloudstorexadmin
    rootPassword: cloudstorexsecretpassword
  defaultBucket: cloudstorex-default
  persistence:
    enabled: true
    size: 20Gi
  service:
    apiPort: 9000
    consolePort: 9001

# External Managed Service Configuration (used when postgresql/redis/minio .enabled is false)
externalDatabase:
  host: ""
  port: 5432
  database: "cloudstorex"
  username: "cloudstorex"
  password: ""

externalRedis:
  host: ""
  port: 6379

externalStorage:
  endpoint: ""
  bucket: "cloudstorex-default"
  accessKey: ""
  secretKey: ""
  useSSL: false
