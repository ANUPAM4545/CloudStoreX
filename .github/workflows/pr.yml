name: Pull Request Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  validate-backend:
    name: Backend Lint, Test & Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Check Code Formatting
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go code is not formatted properly:"
            gofmt -s -d .
            exit 1
          fi

      - name: Run Go Vet & Static Analysis
        run: go vet ./...

      - name: Run Unit & Integration Tests with Coverage
        run: |
          go test -v -covermode=atomic -coverprofile=coverage.out ./...

      - name: Generate Coverage Report
        run: |
          go tool cover -func=coverage.out
          echo "### Test Coverage Summary 📊" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          go tool cover -func=coverage.out | tail -n 1 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.out
          retention-days: 7

  validate-frontend:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Check Formatting & Lint
        run: npm run lint --if-present

      - name: Verify Build
        run: npm run build --if-present
