apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudstorex-network-policy
  labels:
    app.kubernetes.io/name: cloudstorex
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector: {}
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 6379
        - protocol: TCP
          port: 9000
