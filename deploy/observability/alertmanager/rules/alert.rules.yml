groups:
  - name: cloudstorex-alerts
    rules:
      # ==========================================
      # Critical Severity Alerts (Refinement 4)
      # ==========================================
      - alert: StorageProviderUnreachable
        expr: cloudstorex_provider_health_status == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Storage provider {{ $labels.provider }} is unreachable or degraded."
          description: "Provider health check for {{ $labels.provider }} in region {{ $labels.region }} has been failing for more than 2 minutes."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#storageproviderunreachable"

      - alert: HTTPHighErrorRateCritical
        expr: (sum(rate(cloudstorex_http_errors_total{status=~"5.."}[5m])) / sum(rate(cloudstorex_http_requests_total[5m]))) * 100 > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "API 5xx server error rate exceeds 10%."
          description: "CloudStoreX HTTP 5xx error rate is currently {{ $value }}%, above critical threshold of 10%."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#httphigherrorratecritical"

      - alert: PostgresDatabaseUnreachable
        expr: cloudstorex_postgres_connections{status="up"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is unreachable."
          description: "No active database connections for over 1 minute."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#postgresdatabaseunreachable"

      # ==========================================
      # High Severity Alerts
      # ==========================================
      - alert: StorageUploadLatencyHigh
        expr: histogram_quantile(0.95, sum(rate(cloudstorex_provider_latency_seconds_bucket{operation="upload"}[5m])) by (le, provider)) > 5.0
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Storage provider upload latency is elevated."
          description: "P95 upload latency for {{ $labels.provider }} is greater than 5.0 seconds (current: {{ $value }}s)."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#storageuploadlatencyhigh"

      - alert: BackgroundWorkerQueueDepthHigh
        expr: cloudstorex_jobs_queue_depth > 100
        for: 10m
        labels:
          severity: high
        annotations:
          summary: "Background job queue backlog is high."
          description: "Queue {{ $labels.queue }} has over 100 pending jobs for 10 minutes."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#backgroundworkerqueuedepthhigh"

      - alert: ProviderErrorRateHigh
        expr: sum(rate(cloudstorex_provider_errors_total[5m])) by (provider) / sum(rate(cloudstorex_provider_requests_total[5m])) by (provider) * 100 > 5
        for: 5m
        labels:
          severity: high
        annotations:
          summary: "Provider error rate exceeds 5%."
          description: "Provider {{ $labels.provider }} has an elevated error rate of {{ $value }}%."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#providererrorratehigh"

      # ==========================================
      # Medium Severity Alerts
      # ==========================================
      - alert: StorageQuotaThresholdWarning
        expr: sum(cloudstorex_storage_upload_bytes_total) by (workspace) > 10000000000 * 0.85
        for: 15m
        labels:
          severity: medium
        annotations:
          summary: "Workspace storage quota usage > 85%."
          description: "Workspace {{ $labels.workspace }} is approaching its storage quota."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#storagequotathresholdwarning"

      - alert: PolicyEngineFallbackRateHigh
        expr: sum(rate(cloudstorex_policy_fallback_routes_total[10m])) by (workspace) / sum(rate(cloudstorex_policy_evaluations_total[10m])) by (workspace) * 100 > 2
        for: 10m
        labels:
          severity: medium
        annotations:
          summary: "Policy engine fallback routing exceeds 2%."
          description: "Workspace {{ $labels.workspace }} is relying on fallback routes at a rate of {{ $value }}%."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#policyenginefallbackratehigh"

      # ==========================================
      # Low Severity Alerts
      # ==========================================
      - alert: MetadataCatalogGrowthWarning
        expr: rate(cloudstorex_metadata_object_catalog_size[1h]) > 1000
        for: 30m
        labels:
          severity: low
        annotations:
          summary: "Rapid metadata catalog growth detected."
          description: "Catalog size for workspace {{ $labels.workspace }} is growing faster than 1,000 objects per hour."
          runbook_url: "file:///Users/anupam45/CloudStoreX/docs/sre/runbooks.md#metadatacataloggrowthwarning"
