apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudstorex-ingress
  labels:
    app.kubernetes.io/name: cloudstorex
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "500m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: cloudstorex-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudstorex-frontend
                port:
                  number: 3000
